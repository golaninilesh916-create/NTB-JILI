<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTB JILI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101010;
      color: white;
    }

    header {
      background: #1b1b1b;
      padding: 22px 15px;
      text-align: center;
      border-bottom: 2px solid #d4af37;
    }

    h1 {
      color: #ffd700;
      margin: 0;
    }

    .container {
      max-width: 430px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: #202020;
      border: 1px solid #5c4b18;
      border-radius: 14px;
      padding: 20px;
      margin: 15px 0;
    }

    .balance {
      color: #ffd700;
      font-size: 32px;
      font-weight: bold;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
    }

    .note {
      color: #bbb;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<header>
  <h1>NTB JILI</h1>
  <p>YOUR REWARDS WALLET</p>
</header>

<main class="container">

  <section class="card">
    <h2>💰 તમારું ડેમો વૉલેટ</h2>
    <div class="balance" id="balance">₹0</div>
    <p class="note">
      આ ડેમો બેલેન્સ છે. વાસ્તવિક પૈસા નથી.
    </p>
  </section>

  <section class="card">
    <h2>🎁 લૉગિન રિવૉર્ડ</h2>
    <p>પાંચ દિવસની લૉગિન શરતવાળો ડેમો રિવૉર્ડ.</p>
    <button onclick="showMessage('લૉગિન રિવૉર્ડ માટે સુરક્ષિત એકાઉન્ટ સિસ્ટમ જરૂરી છે.')">
      રિવૉર્ડની વિગતો
    </button>
  </section>

  <section class="card">
    <h2>👥 રેફરલ</h2>
    <p>મિત્રોને આમંત્રિત કરો.</p>
    <button onclick="showMessage('રેફરલ સિસ્ટમ હજી ડેમો વર્ઝનમાં છે.')">
      રેફરલની વિગતો
    </button>
  </section>

  <section class="card">
    <h2>🏦 ડિપોઝિટ અને વિથડ્રૉલ</h2>
    <p class="note">
      આ પ્રારંભિક ડેમો છે. UPI પેમેન્ટ અથવા
      વાસ્તવિક નાણાંની લેવડદેવડ જોડેલી નથી.
    </p>
    <button onclick="showMessage('ડેમો: પેમેન્ટ સિસ્ટમ હજી જોડવાની બાકી છે.')">
      ડિપોઝિટ
    </button>
    <button onclick="showMessage('ડેમો: વિથડ્રૉલ સિસ્ટમ હજી જોડવાની બાકી છે.')">
      વિથડ્રૉલ
    </button>
  </section>

</main>

<script>
  function showMessage(message) {
    alert(message);
  }
</script>

</body>
</html>
